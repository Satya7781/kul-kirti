<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Review | कुलकीर्ति</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="pages.css"></head><body class="admin-page"><div id="shared-header"></div><main><section class="page-hero compact"><div class="shell"><p class="eyebrow light">सुरक्षित प्रशासन</p><h1>Admin review panel</h1><p>यह क्षेत्र केवल अधिकृत admin के लिए है।</p></div></section><section class="section admin-section"><div class="shell"><div id="admin-login" class="admin-login"><div class="section-heading"><p class="eyebrow">Authentication</p><h2>Admin login</h2></div><form id="admin-login-form" class="admin-form"><label>Email<input id="admin-email" type="email" required autocomplete="username"></label><label>Password<input id="admin-password" type="password" required autocomplete="current-password"></label><button class="button button-maroon" type="submit">Login <span>→</span></button><p id="admin-login-message" class="form-message" role="alert"></p></form></div><div id="admin-panel" class="admin-panel" hidden><div class="admin-toolbar"><strong>Admin data management</strong><button id="admin-logout" class="button button-outline-dark" type="button">Logout</button></div><div class="admin-tabs"><button class="admin-tab active" data-admin-view="submissions" type="button">Submissions review</button><button class="admin-tab" data-admin-view="gotras" type="button">Gotra management</button></div><div id="admin-submissions" class="admin-submissions"></div><div id="admin-gotras" class="admin-gotras" hidden><form id="gotra-form" class="admin-form gotra-form"><h2>नया सत्यापित गोत्र जोड़ें</h2><p class="form-note">इतिहास और founder की जानकारी केवल प्रमाणित स्रोतों के आधार पर भरें।</p><div class="form-row"><label>गोत्र नाम *<input name="name" required maxlength="120"></label><label>उद्गम स्थान<input name="originPlace" maxlength="200"></label></div><div class="form-row"><label>उद्गम काल / अवधि<input name="originPeriod" maxlength="120"></label><label>स्थापक / प्रारंभिक व्यक्तित्व<input name="founderName" maxlength="120"></label></div><label>स्थापक संबंधी विवरण<textarea name="founderNotes" rows="3"></textarea></label><label>ऐतिहासिक विवरण<textarea name="historicalDetails" rows="4"></textarea></label><label>स्रोत संदर्भ<textarea name="sourceReferences" rows="3" placeholder="पुस्तक, लेखक, पृष्ठ, शिलालेख या archive reference"></textarea></label><div class="family-builder"><div class="builder-heading"><div><p class="eyebrow">ज्ञात सदस्य</p><h3>गोत्र से जुड़े लोगों को जोड़ें</h3></div><button id="add-gotra-member" class="button button-outline-dark" type="button">+ सदस्य जोड़ें</button></div><div id="gotra-member-list"></div></div><button class="button button-maroon" type="submit">गोत्र सुरक्षित करें <span>→</span></button><p id="gotra-message" class="form-message" role="status"></p></form><div id="gotra-list" class="admin-submissions"></div></div></div></div></section></main><div id="shared-footer"></div><script src="app.js"></script></body></html>
